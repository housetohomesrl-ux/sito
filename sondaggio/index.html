<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sondaggio HOUSETOHOME</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
/* Layout: una domanda diretta per schermata su fondo giallo; il logo HOUSETOHOME si disegna a ogni risposta; alla fine solo le soluzioni che servono */
:root{
  --yellow:#F8E07E; --ink:#3F4042; --ink-soft:#5E5F62;
  --paper:#FFFFFF; --paper-hover:#FFFBE3; --line:#4A4B4D; --soft:#FFF6C4; --rule:#E7E1C2;
  --display:'Merriweather', Georgia, 'Times New Roman', serif;
  --body:'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--yellow);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:16px 32px;box-sizing:border-box;gap:16px}
.top{position:relative;display:flex;justify-content:center;align-items:center;min-height:56px}
.logo{width:170px;height:auto;display:block}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);font:600 14px var(--body);color:var(--ink);background:none;border:0;padding:10px 4px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:4px}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:420px){ .logo{width:140px} .back span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} }
.house{width:100%;max-width:300px;height:auto;margin:0 auto;display:block;overflow:visible}
.house .lp{transition:none}
.screen{display:flex;flex-direction:column;gap:18px;animation:in 520ms cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;color:var(--ink);text-wrap:balance;margin:0}
h1,h2{text-align:center}
h1{font-size:clamp(27px,7vw,36px);line-height:1.2}
h2{font-size:clamp(22px,5.6vw,29px);line-height:1.28}
p{margin:0}
.lead{font-size:17px;text-align:center;margin:0 auto;max-width:36ch;text-wrap:pretty}
.hint{font-size:14px;text-align:center;color:var(--ink-soft);margin-top:-8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:2px solid transparent;border-radius:14px;
  padding:14px 16px;min-height:56px;font:400 16px/1.35 var(--body);cursor:pointer;box-shadow:0 1px 0 rgba(63,64,66,.12);transition:border-color 160ms, background 160ms, transform 160ms}
.opt:hover{background:var(--paper-hover)}
.opt:active{transform:scale(.99)}
.opt .mark{flex:none;width:22px;height:22px;border:2px solid var(--ink-soft);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .mark::after{content:"";width:9px;height:5px;border:2.5px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;
  font:700 16px var(--body);background:var(--ink);color:var(--yellow);text-decoration:none;align-self:center;text-align:center;transition:transform 160ms, opacity 160ms}
.btn:hover{transform:translateY(-1px)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.small{font-size:13px;text-align:center;color:var(--ink-soft)}
.kicker{font-family:var(--display);font-style:italic;font-size:19px;text-align:center}
/* soluzioni */
.sol{background:var(--paper);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.tag{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.sol h3{font-size:22px;line-height:1.25}
.doubt{font-family:var(--display);font-style:italic;font-size:16px;background:var(--soft);border-radius:12px;padding:12px 14px}
.sol h4{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;border-top:1px solid var(--rule);padding-top:14px}
.personal{font-weight:600}
.cmp-wrap{overflow-x:auto;margin:0 -4px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:320px}
.cmp th,.cmp td{padding:10px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
.cmp thead th{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cmp thead th.us{color:var(--ink)}
.cmp td.us{background:var(--soft);font-weight:700}
.cmp tbody th{font-weight:600;width:34%}
.fine{font-size:12px;color:var(--ink-soft)}
.timeline{display:grid;grid-template-columns:1fr;gap:12px}
.tl{border:1px solid var(--rule);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tl.us{background:var(--soft);border-color:transparent}
.tl b{font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tl ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.todo li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.todo .n{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font:700 15px var(--display)}
.todo div{min-width:0;padding-top:4px;display:flex;flex-direction:column;gap:2px}
.todo small{font-size:14px;color:var(--ink-soft)}
.plus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plus li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.plus svg{margin-top:3px}
.plus span{min-width:0}
.faq{display:flex;flex-direction:column;gap:12px}
.faq p b{display:block}
select{font:400 16px var(--body);color:var(--ink);border:2px solid #D9D6C8;border-radius:10px;padding:10px 12px;background:var(--paper);min-height:48px;width:100%}
.sv-tipo{display:flex;flex-direction:column;gap:6px}
.sv-lab{font:600 14px var(--body)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border-radius:12px;padding:4px}
.seg-b{min-height:44px;border:0;border-radius:9px;background:transparent;font:600 15px var(--body);color:var(--ink);cursor:pointer}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.seg-b:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.extras{display:flex;flex-direction:column;gap:8px;background:var(--paper);border-radius:12px;padding:12px}
.extras .check{font-size:15px}
.help .calc{margin-top:10px}
.help-or{font-weight:700;margin-top:12px}
.calc-wrap{display:flex;flex-direction:column;gap:14px}
.calc-slot{display:flex;flex-direction:column}
.extras-t{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.calc-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:6px}
.calc-actions .btn{align-self:stretch}
.calc-rows .plus-row{color:var(--ink);font-weight:700}
.why{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.calc-ok-box{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;font-weight:700;margin:0}
.calc-warn{background:var(--paper);border:2px dashed var(--ink-soft);border-radius:12px;padding:12px 14px;margin:0}
.calc-ok{font-weight:700;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.help{background:var(--paper);border-radius:14px;padding:12px 16px;font-size:15px}
.help summary{font-weight:700;cursor:pointer;min-height:28px}
.help ol{margin:10px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.calc{background:var(--soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.calc h4{border-top:0;padding-top:0}
.calc-out{background:var(--paper);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.calc-empty{color:var(--ink-soft);font-size:14px}
.calc-label{font-size:14px;color:var(--ink-soft)}
.calc-mid{font:700 22px/1.1 var(--display)}
.calc-big{font:700 30px/1.1 var(--display)}
.calc-rows{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:4px 0 0;font-size:14px}
.calc-rows dt{color:var(--ink-soft);min-width:0}
.calc-rows dd{margin:0;font-weight:700;text-align:right}
.calc-note{font-size:14px}
.calc-time{font-size:15px;font-weight:700}
.calc-how-t{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.calc-how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.scards{display:flex;flex-direction:column;gap:12px}
.scard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:2px solid transparent;border-radius:18px;padding:12px;cursor:pointer;font:inherit;box-shadow:0 1px 0 rgba(63,64,66,.12);transition:border-color 160ms, transform 160ms}
.scard:hover{border-color:var(--ink)}
.scard:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.scard-img{border-radius:12px;overflow:hidden;background:var(--soft);min-height:120px}
.scard-img img{width:100%;height:100%;object-fit:cover;display:block}
.scard-body{display:flex;flex-direction:column;gap:6px;min-width:0;padding-block:2px}
.scard-title{font:700 18px/1.25 var(--display)}
.scard-doubt{font:italic 14px/1.4 var(--display);color:var(--ink-soft)}
.scard-sum{font-size:14px;line-height:1.45}
.scard-go{margin-top:auto;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.scard.other{grid-template-columns:72px 1fr}
.scard.other .scard-img{min-height:84px}
.others-title{font-size:18px;text-align:center;margin-top:8px}
.personal.center{text-align:center}
.beforeafter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.beforeafter figure{margin:0;display:flex;flex-direction:column;gap:6px}
.beforeafter img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;max-width:100%}
.beforeafter figcaption{font:600 13px var(--body);text-align:center}
.beforeafter .after figcaption{font-weight:700}
.wa-box{background:var(--paper);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.wa-box h3{font-size:21px}
.wa-prev{white-space:pre-line;font-size:14px;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.btn.wa{align-self:stretch}
.wa-box .btn.ghost{align-self:stretch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.two{grid-template-columns:1fr}}
.cta-box{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:6px}
input.err{border-color:#C0392B!important;box-shadow:0 0 0 3px rgba(192,57,43,.18)}
input[type=checkbox].err{outline:3px solid #C0392B;outline-offset:2px}
.note.err-note{color:#A93226;font-weight:600}
.cta-lead{font:400 italic 18px/1.45 var(--display);text-align:center;margin:0;max-width:30ch}
.btn-big{min-height:62px;font-size:18px;padding:0 24px;width:100%;max-width:360px;box-sizing:border-box;text-align:center}
.btn-small{min-height:46px;font-size:14px;padding:0 18px}
.calc-pair{display:flex;flex-direction:column;gap:10px}
form{display:flex;flex-direction:column;gap:12px;background:var(--paper);border-radius:16px;padding:18px}
form h3{font-size:19px}
label{font:600 14px var(--body);display:flex;flex-direction:column;gap:6px}
input,textarea{font:400 16px var(--body);color:var(--ink);border:2px solid #D9D6C8;border-radius:10px;padding:12px;background:var(--paper);min-height:48px;box-sizing:border-box;width:100%}
textarea{min-height:84px;resize:vertical}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:13px;line-height:1.45}
.check input{width:22px;height:22px;min-height:0;flex:none;margin:1px 0 0;accent-color:var(--ink)}
.note{font-size:12px;color:var(--ink-soft)}
.thanks{text-align:center;font-size:16px}
@media (prefers-reduced-motion: reduce){
  .screen{animation:none}
  .house .lp,.opt,.btn{transition:none}
}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <button class="back" id="back" type="button" hidden aria-label="Torna indietro">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Indietro</span>
    </button>
  </div>

  <svg class="house" id="house" viewBox="0 0 640 292" role="img" aria-label="HOUSETOHOME S.r.l.: il logo si disegna mentre rispondi">

<script>
const METODO_URL = "/metodo/";
const PRIVACY_URL = "/privacy/";

const QS = {
  soldi:{ title:"Tra mutuo e risparmi, arrivi al prezzo della casa che vuoi?", opts:[
    {v:"si", t:"Sì, ci arrivo"},
    {v:"no", t:"No, non ci arrivo"},
    {v:"nonso", t:"Non lo so ancora"}
  ]},
  vendere:{ title:"Per comprare la casa nuova, devi prima vendere quella in cui vivi?", opts:[
    {v:"si", t:"Sì"},
    {v:"no", t:"No"}
  ]},
  m_tipo:{ title:"La casa che vuoi, come te la immagini?", opts:[
    {v:"pronta", t:"Già ristrutturata, pronta da vivere"},
    {v:"gusto", t:"Da ristrutturare, per farla a mio gusto"},
    {v:"conta", t:"Non importa com'è oggi: conta come sarà"}
  ]},
  m_banca:{ title:"Sai già quanto mutuo ti può concedere la banca?", opts:[
    {v:"pre", t:"Sì, ho una pre-delibera o una valutazione scritta"},
    {v:"idea", t:"Ho solo un'idea, niente di scritto"},
    {v:"no", t:"No, non ancora"}
  ]},
  liquidita:{ title:()=>"Hai da parte il "+(devoVendere()?"15":"20")+"% del prezzo della casa finita, cioè acquisto più ristrutturazione?",
    hint:()=>devoVendere() ? "È la prima parte della caparra, alla firma del preliminare. La seconda parte la versi quando firmi il compromesso della tua casa. A parte servono solo le spese di notaio e le imposte. Non hai il 15%? Non ti preoccupare, ne parliamo insieme." : "È la caparra del contratto preliminare. A parte servono solo le spese di notaio e le imposte. Non hai il 20%? Non ti preoccupare, ne parliamo insieme.",
    opts:[
      {v:"si", t:"Sì"},
      {v:"forse", t:"Più o meno, devo fare bene i conti"},
      {v:"nonso", t:"Non lo so: voglio calcolarlo", opens:true},
      {v:"no", t:"No"}
    ]},
  v_stato:{ title:"A che punto è la vendita della tua casa?", opts:[
    {v:"no", t:"Non l'ho ancora messa in vendita"},
    {v:"invendita", t:"È in vendita"},
    {v:"acquirente", t:"Ho già un acquirente"}
  ]},
  v_trovata:{ title:"Hai già trovato la casa che vorresti?", hint:"Puoi sceglierne più di una", multi:true, opts:[
    {v:"paura", t:"Sì, e ho paura che qualcun altro la compri prima di me"},
    {v:"tempi", t:"Sì, e vorrei entrarci appena vendo la mia, senza aspettare mesi di lavori"},
    {v:"no", t:"Non ancora, sto cercando", only:true}
  ]},
  r_paure:{ title:"Cosa ti preoccupa della ristrutturazione?", hint:"Puoi sceglierne più di una", multi:true, opts:[
    {v:"costi", t:"Non so quanto costerà"},
    {v:"tempi", t:"Non so quando sarà pronta"},
    {v:"imprevisti", t:"Ho paura di sorprese e imprevisti"},
    {v:"chi", t:"Non so a chi affidarmi"},
    {v:"niente", t:"Niente, non mi preoccupa", only:true}
  ]},
  r_casa:{ title:"La casa da ristrutturare è già tua?", opts:[
    {v:"mia", t:"Sì, è già mia"},
    {v:"compro", t:"La sto comprando"},
    {v:"cerco", t:"Sto ancora cercando"}
  ]}
};

const A = {};
let pos = -1;
let showSolutions = false;

function path(){
  const p = ["soldi","vendere"];
  if(!A.soldi || !A.vendere) return p;
  const m = A.soldi !== "si", v = A.vendere === "si";
  if(m) p.push("m_tipo","m_banca");
  if(v) p.push("v_stato","v_trovata");
  if(m || v) p.push("liquidita");
  if(!m && !v){
    p.push("r_paure");
    if(A.r_paure && !A.r_paure.includes("niente")) p.push("r_casa");
  }
  return p;
}
function route(){
  const m = A.soldi && A.soldi !== "si", v = A.vendere === "si";
  const r = !m && !v && A.r_paure && !A.r_paure.includes("niente");
  const noCash = (m || v) && A.liquidita === "no";
  return {m, v, r, noCash, none: !m && !v && !r};
}

const STEPS = 5;
const reduceHouse = matchMedia("(prefers-reduced-motion: reduce)").matches;
const parts = [...document.querySelectorAll("#house .lp")];
const TMAX = Math.max(...parts.map(p=>+p.dataset.t1));
// il logo si costruisce da sinistra a destra, in proporzione alle risposte date:
// una sola "penna" che avanza in modo fluido, un tratto dopo l'altro
let houseT = 0, houseTarget = 0, houseRaf = 0;
function paintHouse(t){
  parts.forEach(p=>{ const t0=+p.dataset.t0, t1=+p.dataset.t1, l=+p.dataset.l;
    const k=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
    p.style.strokeDashoffset = String((l+1)*(1-k)); });
}
function drawHouse(n){
  houseTarget = TMAX*Math.min(1,Math.max(0,n/STEPS));
  if(reduceHouse){ houseT=houseTarget; paintHouse(houseT); return; }
  if(houseRaf) return;
  let last=performance.now();
  const speed = TMAX/2600; // tutto il logo in circa 2,6 secondi
  const step=(now)=>{
    const dt=Math.min(64,now-last); last=now;
    const d=houseTarget-houseT;
    if(Math.abs(d)<1e-4){ houseT=houseTarget; paintHouse(houseT); houseRaf=0; return; }
    houseT += Math.sign(d)*Math.min(Math.abs(d), speed*dt*(1+Math.min(2,Math.abs(d)/TMAX*3)));
    paintHouse(houseT);
    houseRaf=requestAnimationFrame(step);
  };
  houseRaf=requestAnimationFrame(step);
}

const stage = document.getElementById("stage");
const backBtn = document.getElementById("back");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k===null||k===undefined||k===false) return; e.append(k instanceof Node?k:document.createTextNode(k)); });
  return e;
}
function tick(){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("width","18");s.setAttribute("height","18");s.setAttribute("viewBox","0 0 18 18");s.setAttribute("aria-hidden","true");
  s.innerHTML='<path d="M3.5 9.5l3.5 3.5 7.5-8" fill="none" stroke="#3F4042" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';return s;}
const top0 = ()=>window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});

function render(){
  stage.replaceChildren();
  backBtn.hidden = pos < 0;
  const P = path();
  if(pos < 0) return welcome();
  if(pos >= P.length) return showSolutions ? solutions() : finale();
  question(P[pos], P);
}

function welcome(){
  drawHouse(0);
  stage.append(el("section",{class:"screen"},
    el("h1",{},"Ogni casa comincia da un sogno."),
    el("p",{class:"lead"},"Ti facciamo poche domande, dirette. Parliamo di soldi e di tempi, perché è lì che nascono i dubbi. Alla fine ti mostriamo, nero su bianco, come superarli."),
    el("button",{class:"btn",type:"button",onclick:()=>{pos=0;render();}},"Iniziamo")
  ));
}

function question(id, P){
  const q = QS[id];
  drawHouse(Math.max(0.6, STEPS * pos / Math.max(P.length,1)));
  const s = el("section",{class:"screen"},

    b.addEventListener("click",()=>{
      if(q.multi){

        else if(o.only) arr = [o.v];
        else arr = [...arr.filter(x=>!q.opts.find(z=>z.v===x)?.only), o.v];

const PRUDENZA = 1.02 * 1.01 * 1.01; // +2% (02/11), +1% e +1% (05/11) sui valori di zona
// tempi dei lavori: ristrutturazione parziale 30 giorni; completa 60 giorni fino a 110 m², 90 giorni oltre
const giorniLavori = (m, completa) => !completa ? 30 : (m > 110 ? 90 : 60);
const ZONA = {}, FASCIA = {};
ZONE.forEach(gr=>gr.z.forEach(([n,v,f])=>{ const k=gr.g+" – "+n; ZONA[k]=Math.round(v*PRUDENZA/10)*10; FASCIA[k]=f; }));
function zonaSelect(id){
  return el("select",{id}, el("option",{value:""},"Scegli la zona"),
    ZONE.map(gr=>el("optgroup",{label:gr.g.replace(" (mercato)","")}, gr.z.map(([n])=>el("option",{value:gr.g+" – "+n}, n.replace(" (mercato)",""))))));
}
const valoreMq = (zona,q) => ZONA[zona] - (1-q)*K_L;
const DA_VALUTARE = new Set(["Casalecchio di Reno – Meridiana"]);
function boxInsieme(Z){
  const nome = Z.split(" – ").pop();
  const t = "Ciao, sto cercando casa in zona "+nome+" a Casalecchio di Reno. Vorrei capire insieme a voi quanto vale la casa con i lavori che desidero.";
  return el("div",{class:"calc-ok-box"},
    el("p",{},el("b",{},"In "+nome+" la vediamo insieme.")),

    el("p",{},"Scrivici cosa stai guardando e cosa vorresti cambiare: lo valutiamo insieme e ti diciamo con precisione quanto ti serve per entrarci."),
    el("a",{class:"btn wa",href:"https://wa.me/"+WA_NUM+"?text="+encodeURIComponent(t),target:"_blank",rel:"noopener"},"Scrivici su WhatsApp"));
}
const FINITURE = [
  {id:"pav",   t:"Pavimenti e imbiancatura",                q:0.15},
  {id:"bagno", t:"Bagno nuovo, pavimenti e imbiancatura",   q:0.25}
];
const INTERVENTI = [
  {id:"infissi",  t:"Finestre nuove",                       q:0.30},
  {id:"risc",     t:"Riscaldamento nuovo",                  q:0.25},
  {id:"impianti", t:"Impianto elettrico e idraulico nuovi", q:0.25}
];
const eur = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".") + " €";
const giu = n => Math.floor(n/1000)*1000;
const vic = n => Math.round(n/1000)*1000;
const num = v => { const x = parseFloat(String(v).replace(/\./g,"").replace(",",".").replace(/[^\d.]/g,"")); return isFinite(x) ? x : 0; };

function confetti(){
  if(reduce) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.append(c);
  const ctx = c.getContext("2d"); const W = c.width = innerWidth, H = c.height = innerHeight;
  const colors = ["#F8E07E","#3F4042","#FFFFFF","#E8C200","#8A8B8E"];
  const ps = Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*13-4, r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.3, c:colors[Math.floor(Math.random()*colors.length)]}));
  let t = 0;
  (function f(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++t < 150) requestAnimationFrame(f); else c.remove();
  })();
}

function lavoriPicker(pref, onChange){
  let lavori = "completa";
  const seg = el("div",{class:"seg",role:"group","aria-label":"Tipo di ristrutturazione"});
  const parz = el("div",{class:"extras",hidden:""});
  const chk = {};
  const box = x=>{ const c = el("input",{type:"checkbox",id:pref+x.id}); chk[x.id]=c;
    c.addEventListener("change",()=>{ if(c.checked && FINITURE.some(f=>f.id===x.id)) FINITURE.forEach(f=>{ if(f.id!==x.id) chk[f.id].checked=false; }); onChange(); });
    return el("label",{class:"check",for:pref+x.id},c,el("span",{},x.t)); };
  parz.append(el("p",{class:"extras-t"},"Finiture (scegline una)"), ...FINITURE.map(box), el("p",{class:"extras-t"},"Interventi"), ...INTERVENTI.map(box));
  [["completa","Completa"],["parziale","Solo alcuni lavori"]].forEach(([v,t])=>{
    const b = el("button",{type:"button",class:"seg-b","aria-pressed":v===lavori?"true":"false"},t);
    b.addEventListener("click",()=>{ lavori=v; seg.querySelectorAll(".seg-b").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); parz.hidden = v!=="parziale"; onChange(); });
    seg.append(b);
  });
  return {
    node: el("div",{class:"sv-tipo"}, el("span",{class:"sv-lab"},"Quali lavori vuoi fare?"), seg, parz),
    completa: ()=> lavori==="completa",
    quota: ()=> lavori==="completa" ? 1 : Math.min([...FINITURE,...INTERVENTI].reduce((a,x)=>a+(chk[x.id].checked?x.q:0),0),1)
  };
}

      : "Come funziona: versi il 20% di caparra, cioè "+eur(V*CAPARRA)+". La banca valuta la casa già ristrutturata e ti finanzia l'80%, cioè "+eur(V*LTV)+": con il mutuo paghi il resto al rogito. Usi tutto il mutuo a cui hai diritto, per una casa già finita come la vuoi tu."));

function calcCasa(opts){
  const zona = zonaSelect("cc-zona");
  const mq = el("input",{id:"cc-mq",inputmode:"numeric",placeholder:"es. 80",autocomplete:"off"});
  const out = el("div",{class:"calc-out","aria-live":"polite"});
  const rev = el("div",{class:"calc-rev",hidden:""});
  const lp = lavoriPicker("cc-",()=>update());
  const risp = opts.risparmi ? el("input",{id:"cc-risp",inputmode:"numeric",placeholder:"es. 60.000",autocomplete:"off"}) : null;

  let trovata = "si";
  const prezzo = el("input",{id:"cc-prezzo",inputmode:"numeric",placeholder:"es. 220.000",autocomplete:"off"});
  const segT = el("div",{class:"seg",role:"group","aria-label":"Hai già individuato la casa?"});
  const dove = el("input",{id:"cc-dove",placeholder:"es. via Mazzini, Bologna",autocomplete:"off"});
  const boxSi = el("div",{class:"calc-pair"},
    el("label",{for:"cc-dove"},"Dove si trova (via o zona)", dove),
    el("label",{for:"cc-prezzo"},"Prezzo dell'annuncio (€)", prezzo));
  const boxNo = el("label",{for:"cc-zona",hidden:""},"Zona", zona);
  [["si","Sì, l'ho trovata"],["no","Non ancora"]].forEach(([v,t])=>{
    const b = el("button",{type:"button",class:"seg-b","aria-pressed":v===trovata?"true":"false"},t);
    b.addEventListener("click",()=>{ trovata=v; segT.querySelectorAll(".seg-b").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); boxSi.hidden = v!=="si"; boxNo.hidden = v==="si"; update(); });
    segT.append(b);
  });

  function update(){
    out.replaceChildren();
    const Z = zona.value, M = num(mq.value), Q = lp.quota(), PA = num(prezzo.value);
    if(trovata==="si" ? (!PA || !M) : (!Z || !M)){ out.append(el("p",{class:"calc-empty"}, trovata==="si" ? "Scrivi il prezzo dell'annuncio e i metri quadri per vedere il risultato." : "Scegli la zona e scrivi i metri quadri per vedere il risultato.")); return; }
    if(trovata!=="si" && DA_VALUTARE.has(Z)){ out.append(boxInsieme(Z)); return; }
    if(Q===0){ out.append(el("p",{class:"calc-empty"},"Scegli i lavori che vuoi fare per vedere il risultato.")); return; }
    const V = trovata==="si" ? vic(PA*0.97 + M*K_T*Q) : vic(valoreMq(Z,Q)*M);
    LAST.casa = {zona: trovata==="si" ? "" : Z, dove: trovata==="si" ? dove.value.trim() : "", prezzo: trovata==="si" ? PA : 0, mq:M, lavori: Q>=1 ? "completa" : "parziale", V};
    if(opts.risparmi) return esitoCaparra(V, M);
    const yes = el("button",{class:"btn",type:"button"},"Ho questa cifra: partiamo");
    const msg = el("p",{class:"calc-ok",hidden:""},"Perfetto: hai la base per realizzare il tuo sogno.");
    yes.addEventListener("click",()=>{ confetti(); msg.hidden=false; yes.disabled=true; if(opts.onYes) setTimeout(opts.onYes, reduce?300:1800); else msg.textContent += " Lasciaci il tuo contatto qui sotto e partiamo."; });
    const no = el("button",{class:"btn ghost",type:"button"},"Non ce l'ho ancora: scopri quale casa puoi comprare");
    no.addEventListener("click",()=>{ rev.hidden=false; rev.replaceChildren(calcInverso(trovata==="si"?"":Z, lp)); rev.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); });
    out.append(
      el("p",{class:"calc-label"},"Prezzo della casa finita"),
      el("p",{class:"calc-big"},eur(V)),
      righeConti(V),
      el("p",{class:"calc-time"},"Casa pronta in "+giorniLavori(M,lp.completa())+" giorni."),
      spiegaConti(V),
      el("p",{class:"fine"}, trovata==="si"
        ? "Prezzo della casa finita, lavori compresi. Escluso garage e posto auto. Questi sono i tuoi conti, chiari dal primo giorno. Da qui partiamo insieme."
        : "Prezzo di una casa finita con cantina nella zona che hai scelto, lavori compresi. Escluso garage e posto auto. Questi sono i tuoi conti, chiari dal primo giorno. Da qui partiamo insieme."),
      speseNotaio(),
      el("div",{class:"calc-actions"}, yes, msg, no)
    );
  }

  function calcInverso(zonaIniziale){
    const liq = el("input",{id:"cr-liq",inputmode:"numeric",placeholder:"es. 60.000",autocomplete:"off"});
    const mutIn = el("input",{id:"cr-mutuo",inputmode:"numeric",placeholder:"es. 240.000",autocomplete:"off"});
    const z2 = zonaSelect("cr-zona"); if(zonaIniziale) z2.value = zonaIniziale;
    const o = el("div",{class:"calc-out","aria-live":"polite"});
    const lp2 = lavoriPicker("cr-",()=>up());
    function up(){
      o.replaceChildren();
      const L = num(liq.value), Z = z2.value, Q = lp2.quota(), MU = devoVendere() ? 0 : num(mutIn.value);
      if(!L || !Z){ o.append(el("p",{class:"calc-empty"},"Scrivi la tua liquidità e scegli la zona.")); return; }
      if(DA_VALUTARE.has(Z)){ o.append(boxInsieme(Z)); return; }
      if(Q===0){ o.append(el("p",{class:"calc-empty"},"Scegli i lavori che vuoi fare.")); return; }

      const V = MU ? giu(L + MU) : giu(L/capIniziale()), mqMax = Math.floor(V/valoreMq(Z,Q));
      const capMU = Math.min(L, V*CAPARRA);
      LAST.inverso = {zona:Z, liq:L, V, mq:mqMax};
      o.append(
        el("p",{class:"calc-label"},"Puoi puntare a una casa finita fino a"),
        el("p",{class:"calc-big"},eur(V)),
        el("p",{class:"calc-label"},"In zona "+Z.split(" – ").pop().replace(" (mercato)","")+", con i lavori che hai scelto, corrisponde a una casa di "),
        el("p",{class:"calc-mid"},mqMax+" m²"),
        el("p",{class:"calc-time"},"Casa pronta in "+giorniLavori(mqMax,lp2.completa())+" giorni."),
        ...(MU ? [
          el("dl",{class:"calc-rows"},
            el("dt",{},"Mutuo della pre-delibera + i tuoi risparmi"), el("dd",{},eur(MU)+" + "+eur(L)),
            el("dt",{},"Caparra alla firma del preliminare ("+(Math.round(capMU/V*1000)/10).toLocaleString("it-IT")+"%)"), el("dd",{},eur(capMU)),
            el("dt",{},"Al rogito, con il mutuo"+(V-capMU>MU?" e i risparmi che ti restano":"")), el("dd",{},eur(V-capMU))),
          L < V*CAPARRA ? el("p",{class:"fine"},"La caparra che chiediamo è il 20%, cioè "+eur(V*CAPARRA)+". Hai "+eur(L)+": non ti preoccupare, ne parliamo insieme.") : ""
        ] : [
          righeConti(V),
          spiegaConti(V),
          devoVendere() ? "" : el("p",{class:"calc-note"},"Hai già la pre-delibera? Scrivi qui sopra il mutuo massimo: il conto diventa più preciso.")
        ]),
        opts.onContinue ? el("button",{class:"btn",type:"button",onclick:opts.onContinue},"Continua con questa cifra") : ""
      );
    }
    liq.addEventListener("input",up); mutIn.addEventListener("input",up); z2.addEventListener("change",up); up();
    return el("div",{class:"calc"},
      el("h4",{},"Quale casa puoi comprare con i tuoi risparmi"),
      el("p",{},"Scrivi la liquidità che hai, scegli la zona e i lavori: ti diciamo il valore della casa finita a cui puoi puntare e quanti metri quadri corrispondono."),
      el("label",{for:"cr-liq"},"Liquidità per la caparra (\u20ac)", liq),
      devoVendere() ? null : el("label",{for:"cr-mutuo"},"Mutuo della tua pre-delibera, se ce l'hai (\u20ac)", mutIn),
      el("label",{for:"cr-zona"},"Zona", z2),
      lp2.node,
      o
    );
  }

  // esito per chi arriva dalla pagina del mutuo: confronta i risparmi con la caparra del 20%
  function esitoCaparra(V, M){
    const S = num(risp.value), need = V*CAPARRA;
    out.append(
      el("p",{class:"calc-label"},"Prezzo della casa finita"),
      el("p",{class:"calc-big"},eur(V)),
      el("p",{class:"calc-time"},"Casa pronta in "+giorniLavori(M,lp.completa())+" giorni."),
      el("dl",{class:"calc-rows"},
        el("dt",{},"Caparra alla firma del preliminare (20%)"), el("dd",{},eur(need)),
        el("dt",{},"Mutuo da chiedere in banca (80%)"), el("dd",{},eur(V*LTV)))
    );
    if(!S){ out.append(el("p",{class:"calc-empty"},"Scrivi i tuoi risparmi per sapere se hai la caparra.")); return; }
    LAST.risparmi = S;
    const parla = (testo, cls) => { const b = el("button",{class:"btn "+(cls||"ghost"),type:"button"},testo); b.addEventListener("click",()=>opts.onTalk(S>=need?"vicino":(S>=need*VICINO?"vicino":"lontano"))); return b; };
    if(S >= need){
      const yes = el("button",{class:"btn",type:"button"},"Ho i soldi: partiamo");
      const msg = el("p",{class:"calc-ok",hidden:""},"Perfetto: hai la caparra per la casa che vuoi. Lasciaci i tuoi dati e partiamo.");
      yes.addEventListener("click",()=>{ confetti(); msg.hidden=false; yes.disabled=true; setTimeout(()=>opts.onYes(), reduce?300:1600); });
      out.append(el("p",{class:"calc-ok"},"I tuoi risparmi coprono la caparra."), el("div",{class:"calc-actions"}, yes, msg, parla("Ci arrivo vicino: parliamone comunque")));
    } else if(S >= need*VICINO){
      out.append(el("p",{class:"personal"},"Ci sei quasi. Contattaci: troviamo insieme la soluzione per arrivare alla casa che desideri."),
        el("div",{class:"calc-actions"}, parla("Ci arrivo vicino: parliamone","")));
    } else {
      const ristr = el("a",{class:"btn",href:"#ristrutturazione"},"Scopri la sola ristrutturazione");
      ristr.addEventListener("click",e=>{ e.preventDefault(); opts.onRistr(); });
      out.append(el("p",{class:"personal"},"Per questa casa c'è una strada più adatta a te: la compri tu e noi la ristrutturiamo come la desideri, con un prezzo fissato prima di iniziare. Oppure parliamone: troviamo insieme la soluzione."),
        el("div",{class:"calc-actions"}, ristr, parla("Parliamone comunque")));
    }
  }

  zona.addEventListener("change",update); mq.addEventListener("input",update); prezzo.addEventListener("input",update); dove.addEventListener("input",update); if(risp) risp.addEventListener("input",update); update();
  return el("div",{class:"calc-wrap"},
    el("div",{class:"calc"},
      el("h4",{},"Quanto ti serve davvero"),
      el("p",{},"Dicci la casa e i lavori che vuoi fare: ti diciamo quanto costa la casa finita e la caparra da versare."),
      el("div",{class:"sv-tipo"}, el("span",{class:"sv-lab"},"Hai già individuato la casa?"), segT),
      boxSi, boxNo,
      el("label",{for:"cc-mq"},"Metri quadri", mq),
      lp.node,
      risp ? el("label",{for:"cc-risp"},"I tuoi risparmi per la caparra (€)", risp) : null,
      out
    ),
    rev
  );
}

function speseNotaio(){
  return el("p",{class:"fine"},"A parte servono le spese del notaio e le imposte, come da un privato: il 2% del valore catastale per la prima casa, il 9% per la seconda.");
}
function pianoSoldi(){
  const inp = (id,ph,val)=>el("input",{id,inputmode:"numeric",placeholder:ph,autocomplete:"off",value:val||""});
  const nuova = inp("ps-nuova","es. 400.000", LAST.casa ? LAST.casa.V.toLocaleString("it-IT") : "");
  const vendo = inp("ps-vendo","es. 200.000");
  const residuo = inp("ps-residuo","0 se non hai mutuo");
  const risp = inp("ps-risp","es. 70.000");
  const capPct = inp("ps-cap","10","10");
  const o = el("div",{class:"calc-out","aria-live":"polite"});
  const pc = (x,V)=> (Math.round(x/V*1000)/10).toLocaleString("it-IT")+"%";
  function up(){
    o.replaceChildren();
    const V=num(nuova.value), P=num(vendo.value), D=num(residuo.value), S=num(risp.value), cp=num(capPct.value)/100;
    if(!V||!P||!risp.value){ o.append(el("p",{class:"calc-empty"},"Scrivi il prezzo della casa nuova, a quanto vendi la tua e i tuoi risparmi.")); return; }
    const netto = Math.max(0,P-D);
    const firma = V*0.15;
    const capInc = P*cp;
    const seconda = V*SECONDA;
    const integra = Math.max(0, seconda - capInc);
    const rogito = V - firma - seconda;

    const rispUsati = Math.min(S, Math.max(firma + integra, V - netto));
    const vendUsati = Math.min(netto, V - rispUsati);
    const mutuo = Math.max(0, V - rispUsati - vendUsati);
    const avanzo = Math.max(0, S + netto - V);
    const msgs = [];
    if(mutuo===0) msgs.push(el("p",{class:"calc-ok-box"},"Con la vendita della tua casa e i tuoi risparmi copri tutto l'acquisto: non ti serve un mutuo."+(avanzo>0?" E ti restano "+eur(avanzo)+".":"")));
    else if(mutuo > V*LTV) msgs.push(el("p",{class:"calc-warn"},"Ti servirebbe un mutuo di "+eur(mutuo)+", cioè il "+pc(mutuo,V)+" della casa nuova: è più dell'80% che le banche finanziano di solito. Non ti preoccupare, ne parliamo insieme e troviamo la soluzione giusta."));
    else msgs.push(el("p",{class:"calc-ok-box"},"Ti serve un mutuo di "+eur(mutuo)+", il "+pc(mutuo,V)+" della casa nuova. Verifica con la pre-delibera che la rata sia sostenibile per il tuo reddito."));
    if(S < firma) msgs.push(el("p",{class:"calc-warn"},"Alla firma del preliminare serve il 15%, cioè "+eur(firma)+": oggi hai "+eur(S)+", ne mancano "+eur(firma-S)+". Con i tuoi risparmi di oggi puoi fermare una casa finita fino a "+eur(Math.floor(S/0.15/1000)*1000)+". Non ti preoccupare, ne parliamo: scrivici e troviamo insieme la strada."));
    else if(S - firma < integra) msgs.push(el("p",{class:"calc-warn"},"Al compromesso versi il 10%, cioè "+eur(seconda)+". La caparra che incassi è "+eur(capInc)+": i "+eur(integra)+" che mancano li metti dai risparmi. Dopo la firma te ne restano "+eur(S-firma)+": ne mancano "+eur(integra-(S-firma))+": non ti preoccupare, ne parliamo insieme."));
    o.append(
      ...msgs,
      el("p",{class:"calc-how-t"},"Da dove arrivano i soldi"),
      el("dl",{class:"calc-rows"},
        el("dt",{},"I tuoi risparmi"), el("dd",{},eur(rispUsati)+" · "+pc(rispUsati,V)),
        el("dt",{},"Vendita della tua casa"+(D?" (tolto il mutuo residuo)":"")), el("dd",{},eur(vendUsati)+" · "+pc(vendUsati,V)),
        el("dt",{},"Nuovo mutuo"), el("dd",{},eur(mutuo)+" · "+pc(mutuo,V))
      ),
      el("p",{class:"calc-how-t"},"Quando paghi"),
      el("dl",{class:"calc-rows"},
        el("dt",{},"Alla firma del preliminare, dai risparmi"), el("dd",{},eur(firma)+" · 15%"),
        el("dt",{},"Al compromesso della tua casa"+(integra?" (caparra incassata + "+eur(integra)+" dai risparmi)":", con la caparra che incassi")), el("dd",{},eur(seconda)+" · "+pc(seconda,V)),
        el("dt",{},"Al rogito"+(mutuo?", con il resto della vendita e il mutuo":", con il resto della vendita")), el("dd",{},eur(rogito)+" · "+pc(rogito,V))
      ),
      el("p",{class:"fine"},"Caparra totale prima del rogito: "+eur(firma+seconda)+" ("+pc(firma+seconda,V)+")."),
      S >= firma ? notaQuindici() : "",
      speseNotaio()
    );
    LAST.piano = {V,P,D,S,mutuo};
  }
  [nuova,vendo,residuo,risp,capPct].forEach(i=>i.addEventListener("input",up)); up();
  return el("div",{class:"calc"},

function calcolatore(){
  const fmt = eur;
  const pc = (x,V)=> (Math.round(x/V*1000)/10).toLocaleString("it-IT")+"%";
  const out = el("div",{class:"calc-out","aria-live":"polite"},
    el("p",{class:"calc-empty"},"Inserisci i due importi per vedere il risultato."));
  const mut = el("input",{id:"calc-mutuo",inputmode:"numeric",placeholder:"es. 240.000",autocomplete:"off"});
  const ris = el("input",{id:"calc-risparmi",inputmode:"numeric",placeholder:"es. 80.000",autocomplete:"off"});
  function update(){
    const M = num(mut.value), S = num(ris.value);
    out.replaceChildren();
    if(!M || !S){ out.append(el("p",{class:"calc-empty"},"Inserisci i due importi per vedere il risultato.")); return; }

    const P = Math.floor((M + S)/1000)*1000;
    const cap = Math.min(S, P*CAPARRA);
    const sotto = S < P*CAPARRA;
    const rog = P - cap;
    const perito = Math.ceil(M/LTV/1000)*1000;
    out.append(
      el("p",{class:"calc-label"},"Puoi puntare a una casa ristrutturata fino a"),
      el("p",{class:"calc-big"},fmt(P)),
      el("p",{class:"calc-how-t"},"Come si arriva a questa cifra"),
      el("ol",{class:"calc-how"},
        el("li",{},"Mutuo della pre-delibera più i tuoi risparmi: ",el("b",{},fmt(M)+" + "+fmt(S)+" = "+fmt(P))),
        el("li",{},"Alla firma del preliminare versi la caparra: ",el("b",{},fmt(cap)+" ("+pc(cap,P)+")"),"."),
        el("li",{},"Al rogito paghi il resto, ",el("b",{},fmt(rog)),", con il mutuo"+(rog>M?" e i risparmi che ti restano.":"."))
      ),
      sotto ? el("p",{class:"calc-note"},"La caparra che chiediamo è il 20%, cioè "+fmt(P*CAPARRA)+". Hai "+fmt(S)+": non ti preoccupare, ne parliamo insieme.") : "",
      el("p",{class:"calc-note"},"Il prezzo della casa finita lo conosci dal primo giorno ed è scritto nel preliminare: nessuna sorpresa."),
      el("p",{class:"calc-note"},"È la cifra della casa che sogni: scrivici qui sotto e partiamo.")
    );
  }
  mut.addEventListener("input",update); ris.addEventListener("input",update);
  return el("div",{class:"calc"},
    el("h4",{},"Fai i tuoi conti"),
    el("p",{},"Usa i tuoi numeri. Nessuno li vede, servono solo a te."),
    el("label",{for:"calc-mutuo"},"Mutuo massimo scritto nella tua pre-delibera (€)", mut),
    el("label",{for:"calc-risparmi"},"Risparmi che puoi usare per la caparra (€)", ris),
    out,
    el("p",{class:"fine"},"Esclusi notaio, imposte e spese di mutuo, che si pagano a parte.")
  );
}

function messaggioWA(nome){
  const R = route(), r = [];
  r.push("Ciao HOUSETOHOME" + (nome ? ", sono "+nome : "") + "!");
  if(A.origine){
    r.push(A.pagina || "Ho letto la pagina del mutuo sulla casa finita.");
    r.push(A.origine);
  } else r.push("Ho fatto il vostro sondaggio e vorrei parlarvi di:");
  // il mutuo è un problema solo se i conti lo dicono: la banca finanzia fino all'80% del valore della casa
  const pv = LAST.piano && LAST.piano.V ? LAST.piano : null;
  const quota = pv && pv.mutuo ? Math.round(pv.mutuo/pv.V*100) : 0;
  const banca = A.m_banca==="pre" ? " (ho già una pre-delibera)" : A.m_banca==="no" ? " (non sono ancora andato in banca)" : "";
  const art = q => (/^(8|11)\d?$/.test(String(q)) ? "l'" : "il ")+q+"%";
  const passoBanca = A.m_banca==="pre" ? "ho già una pre-delibera" : "devo andare in banca per informarmi e chiedere la pre-delibera";
  if(pv){
    if(quota>80) r.push("- mutuo: il mutuo che mi servirebbe è "+art(quota)+" del valore della casa, oltre l'80% che la banca finanzia di solito; "+passoBanca);
    else if(quota>0) r.push("- mutuo: mi serve un mutuo basso, "+art(quota)+" del valore della casa; "+passoBanca);
  } else if(R.m){
    r.push(A.soldi==="nonso"
      ? "- mutuo: non so ancora se con mutuo e risparmi arrivo al prezzo della casa che vorrei"+banca
      : "- mutuo: vorrei capire come arrivare al prezzo della casa che desidero"+banca);
  }
  if(R.v){
    const st = {no:"non l'ho ancora messa in vendita", invendita:"è già in vendita", acquirente:"ho già un acquirente"}[A.v_stato];
    const vt = A.v_trovata||[];
    r.push("- devo prima vendere la mia casa" + (st ? " ("+st+")" : ""));
    if(vt.includes("paura")||vt.includes("tempi")) r.push("- ho già trovato la casa che vorrei" + (vt.includes("tempi") ? " e vorrei entrarci appena vendo la mia" : ""));
  }
  if(R.r || R.noCash){
    const pm = {costi:"i costi", tempi:"i tempi", imprevisti:"gli imprevisti", chi:"a chi affidarmi"};
    const pp = (A.r_paure||[]).map(x=>pm[x]).filter(Boolean);
    r.push("- ristrutturazione" + (pp.length ? ": mi preoccupano "+pp.join(", ") : ""));
    const rc = {mia:"la casa è già mia", compro:"la sto comprando", cerco:"sto ancora cercando la casa"}[A.r_casa];
    if(rc) r.push("- "+rc);
  }
  if(R.none && !A.origine) r.push("- una consulenza per la casa che sto cercando");
  if(A.origine && LAST.risparmi) r.push("I miei risparmi per la caparra: "+eur(LAST.risparmi)+".");
  if(LAST.casa){
    const c=LAST.casa, w=[];
    if(c.dove) w.push(c.dove); else if(c.zona) w.push("zona "+zonaBreve(c.zona));
    w.push(c.mq+" m²");
    if(c.prezzo) w.push("prezzo dell'annuncio "+eur(c.prezzo));
    w.push("ristrutturazione "+c.lavori);
    r.push((c.prezzo ? "Ho già trovato la casa: " : "Casa che cerco: ")+w.join(", ")+" (valore stimato da finita "+eur(c.V)+").");
  }
  else if(LAST.inverso) r.push("Ho "+eur(LAST.inverso.liq)+" di liquidità e cerco in zona "+zonaBreve(LAST.inverso.zona)+".");
  if(LAST.piano) r.push("Vendo la mia casa a "+eur(LAST.piano.P)+(LAST.piano.D?" (mutuo residuo "+eur(LAST.piano.D)+")":"")+", ho "+eur(LAST.piano.S)+" di risparmi"+(LAST.piano.mutuo?" e mi servirebbe un mutuo di "+eur(LAST.piano.mutuo):" e non mi servirebbe un mutuo")+".");
  const liq = {si:"sì", forse:"più o meno, devo fare bene i conti", no:"da valutare insieme"}[A.liquidita];
  if(liq) r.push("Risparmi per la caparra: "+liq+".");
  r.push("Quando possiamo sentirci?");
  return r.join("\n");
}

  top0();
}

function detailView(k){
  const c = CARDS[k], R = route();
  stage.append(el("section",{class:"screen"},
    el("p",{class:"kicker"},c.tag),
    el("h1",{},c.title),
    el("div",{class:"beforeafter"},
      el("figure",{},el("img",{src:c.img[0],alt:"La casa prima dei lavori"}),el("figcaption",{},"La casa che guardi oggi")),
      el("figure",{class:"after"},el("img",{src:c.img[1],alt:"La stessa casa dopo i lavori"}),el("figcaption",{},"Quella che potrai avere"))
    ),
    el("p",{class:"small"},"Un lavoro reale di HOUSETOHOME: "+c.where+"."),
    c.body(R),
    contactBlock(),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{detail=null;render();}},"Torna alle soluzioni")
  ));
  top0();
}

// modalità aperte dalla pagina del mutuo: #inizia (contatto diretto) e #calcola (caparra)
function modoMutuo(m){
  stage.replaceChildren(); backBtn.hidden = true; drawHouse(STEPS);
  for(const k in A) delete A[k];
  const slot = el("div",{class:"contact-slot"});
  const apriContatti = (testo)=>{ A.origine = testo; slot.replaceChildren(...contactBlock()); slot.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); };
  if(m==="vendita"){
    A.origine = "- devo vendere la mia casa e vorrei parlarvi della casa pronta quando vendo";
    A.pagina = "Ho letto la pagina della casa pronta quando vendi."; A.tema = "Casa da vendere";
    stage.append(el("section",{class:"screen"},
      el("p",{class:"kicker"},"La casa pronta quando vendi"),
      el("h1",{},"Partiamo dalla casa che desideri."),
      el("p",{class:"lead"},"Lasciaci i tuoi dati e scegli come vuoi essere contattato: ti spieghiamo come vendere la tua casa con calma ed entrare in quella nuova già pronta."),
      ...contactBlock()));
  } else if(m==="inizia"){
    A.origine = "- vorrei iniziare: ho già i soldi per la caparra, per il mutuo mi affido a voi";
    stage.append(el("section",{class:"screen"},
      el("p",{class:"kicker"},"Il mutuo sulla casa finita"),
      el("h1",{},"Partiamo dalla casa che desideri."),
      el("p",{class:"lead"},"Hai già i soldi per la caparra: al mutuo ci pensa HOUSETOHOME. Lasciaci i tuoi dati e scegli come vuoi essere contattato."),
      ...contactBlock()));
  } else {
    stage.append(el("section",{class:"screen"},
      el("p",{class:"kicker"},"Il mutuo sulla casa finita"),
      el("h1",{},"Hai la caparra per la casa che vuoi?"),
      el("p",{class:"lead"},"Inserisci qui sotto la casa, i lavori e i tuoi risparmi: calcoliamo il prezzo della casa finita e la caparra da versare."),
      calcCasa({risparmi:true,
        onYes:()=>apriContatti("- ho fatto il calcolo: ho la caparra per la casa che voglio, partiamo"),
        onTalk:(q)=>apriContatti(q==="lontano" ? "- ho fatto il calcolo per il mutuo sulla casa finita e vorrei parlarne" : "- ho fatto il calcolo: per la caparra ci arrivo vicino, vorrei parlarne"),
        onRistr:()=>{ stage.replaceChildren(); A.origine=""; delete A.origine; detailView("r"); }}),
      el("div",{class:"cta-box"},
        el("p",{class:"cta-lead"},"Scrivici: troviamo insieme la strada per la tua casa."),
        el("button",{class:"btn",type:"button",onclick:()=>apriContatti("- vorrei parlarvi del mutuo sulla casa finita")},"Scrivici subito")),
      slot));
  }
  top0();
}

backBtn.addEventListener("click",()=>{
  if(detail){ detail=null; render(); return; }
  if(showSolutions){ showSolutions=false; render(); return; }
  if(pos>=0){ pos--; render(); }
});
const MODO = location.hash.replace("#","");
if(MODO==="calcola" || MODO==="inizia" || MODO==="vendita") modoMutuo(MODO); else render();
</script>
